<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Order AI — Benchmark</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #0f1117; color: #e2e8f0; min-height: 100vh; }

  .header { padding: 24px 32px; border-bottom: 1px solid #1e2332; display: flex; align-items: center; gap: 24px; flex-wrap: wrap; }
  .header h1 { font-size: 18px; font-weight: 600; color: #f8fafc; }
  .header .sub { font-size: 13px; color: #64748b; }

  .controls { display: flex; gap: 10px; align-items: center; margin-left: auto; flex-wrap: wrap; }
  .api-input { background: #1a1f2e; border: 1px solid #2a3040; border-radius: 6px; padding: 7px 12px; color: #e2e8f0; font-size: 13px; width: 280px; outline: none; }
  .api-input:focus { border-color: #4f6ef7; }

  button { border: none; border-radius: 6px; padding: 8px 18px; font-size: 13px; font-weight: 500; cursor: pointer; transition: opacity .15s; }
  button:hover { opacity: .85; }
  button:disabled { opacity: .4; cursor: not-allowed; }
  .btn-run { background: #4f6ef7; color: #fff; }
  .btn-clear { background: #1e2332; color: #94a3b8; }

  .summary { padding: 16px 32px; display: flex; gap: 24px; align-items: center; border-bottom: 1px solid #1e2332; flex-wrap: wrap; }
  .stat { display: flex; flex-direction: column; gap: 2px; }
  .stat .label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: #64748b; }
  .stat .value { font-size: 22px; font-weight: 700; }
  .stat .value.pass { color: #22c55e; }
  .stat .value.fail { color: #ef4444; }
  .stat .value.neutral { color: #94a3b8; }
  .progress-bar { flex: 1; min-width: 200px; height: 6px; background: #1e2332; border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; background: #22c55e; border-radius: 3px; transition: width .3s; }

  .table-wrap { overflow-x: auto; padding: 0 32px 32px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; margin-top: 20px; }
  th { text-align: left; padding: 9px 12px; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: #64748b; border-bottom: 1px solid #1e2332; white-space: nowrap; }
  td { padding: 10px 12px; border-bottom: 1px solid #151b28; vertical-align: top; }
  tr:hover td { background: #141920; }

  .badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; font-weight: 600; white-space: nowrap; }
  .badge.pass { background: #14532d; color: #22c55e; }
  .badge.fail { background: #450a0a; color: #ef4444; }
  .badge.running { background: #1e3a5f; color: #60a5fa; }
  .badge.pending { background: #1e2332; color: #64748b; }
  .badge.exact { background: #1e3a5f; color: #60a5fa; }
  .badge.clarif { background: #2d1f4e; color: #a78bfa; }
  .badge.no-result { background: #3b2000; color: #fb923c; }

  .query-cell { max-width: 220px; }
  .query-cell .query-text { color: #f1f5f9; font-weight: 500; }
  .query-cell .expect { font-size: 11px; color: #64748b; margin-top: 3px; }

  .items-cell { max-width: 340px; }
  .item-tag { display: inline-block; background: #1a1f2e; border: 1px solid #2a3040; border-radius: 4px; padding: 2px 7px; font-size: 11px; color: #94a3b8; margin: 2px 2px 0 0; }
  .item-tag.matched { border-color: #22c55e44; color: #86efac; background: #14532d22; }

  .latency { color: #94a3b8; font-variant-numeric: tabular-nums; }
  .latency.slow { color: #fb923c; }
  .conf { font-variant-numeric: tabular-nums; }

  .error-cell { color: #f87171; font-size: 11px; max-width: 280px; word-break: break-all; }

  .filter-bar { padding: 12px 32px; display: flex; gap: 8px; flex-wrap: wrap; }
  .filter-btn { padding: 4px 12px; border-radius: 20px; font-size: 12px; background: #1e2332; color: #64748b; border: 1px solid #2a3040; cursor: pointer; }
  .filter-btn.active { background: #4f6ef7; color: #fff; border-color: #4f6ef7; }
</style>
</head>
<body>

<div class="header">
  <div>
    <div class="header h1">Order AI — Benchmark</div>
    <div class="sub">30 test cases · True/False evaluation</div>
  </div>
  <div class="controls">
    <input class="api-input" id="apiUrl" value="http://localhost:9199/api/v1/search/product" placeholder="API URL">
    <button class="btn-run" id="btnRun" onclick="runAll()">▶ Run All</button>
    <button class="btn-clear" onclick="clearResults()">Reset</button>
  </div>
</div>

<div class="summary" id="summary" style="display:none">
  <div class="stat"><div class="label">Pass</div><div class="value pass" id="sPass">0</div></div>
  <div class="stat"><div class="label">Fail</div><div class="value fail" id="sFail">0</div></div>
  <div class="stat"><div class="label">Total</div><div class="value neutral" id="sTotal">0</div></div>
  <div class="stat"><div class="label">Pass rate</div><div class="value neutral" id="sRate">—</div></div>
  <div class="stat"><div class="label">Avg latency</div><div class="value neutral" id="sLatency">—</div></div>
  <div class="progress-bar"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
</div>

<div class="filter-bar">
  <button class="filter-btn active" onclick="setFilter('all', this)">All</button>
  <button class="filter-btn" onclick="setFilter('pass', this)">✓ Pass</button>
  <button class="filter-btn" onclick="setFilter('fail', this)">✗ Fail</button>
  <button class="filter-btn" onclick="setFilter('pending', this)">Pending</button>
</div>

<div class="table-wrap">
<table id="resultTable">
<thead>
  <tr>
    <th>#</th>
    <th>Query</th>
    <th>Status</th>
    <th>Response Type</th>
    <th>Confidence</th>
    <th>Items trả về</th>
    <th>Latency</th>
  </tr>
</thead>
<tbody id="tbody"></tbody>
</table>
</div>

<script>
// ─────────────────────────────────────────────
// TEST CASES
// pass_if.contains  → ít nhất 1 item.name chứa string này (case-insensitive)
// pass_if.type      → response.type phải bằng giá trị này (optional)
// ─────────────────────────────────────────────
const TESTCASES = [
  // === SIMPLE CATEGORY ===
  { id:  1, group: "Simple",   query: "cho mua coca",                     pass_if: { contains: "Coca Cola" } },
  { id:  2, group: "Simple",   query: "cho mua bia",                      pass_if: { contains: "beer", type: "needs_clarification" } },
  { id:  3, group: "Simple",   query: "cho mua nước suối",                pass_if: { contains_any: ["Lavie", "Aquafina"] } },
  { id:  4, group: "Simple",   query: "cho mua sữa",                      pass_if: { contains_any: ["Vinamilk", "TH True Milk"] } },
  { id:  5, group: "Simple",   query: "cho mua mì gói",                   pass_if: { contains_any: ["Hảo Hảo", "Omachi"] } },

  // === BRAND SPECIFIC ===
  { id:  6, group: "Brand",    query: "cho mua bia heineken",             pass_if: { contains: "Heineken" } },
  { id:  7, group: "Brand",    query: "cho mua sữa vinamilk",             pass_if: { contains: "Vinamilk" } },
  { id:  8, group: "Brand",    query: "cho mua pepsi",                    pass_if: { contains: "Pepsi" } },
  { id:  9, group: "Brand",    query: "cho mua sprite",                   pass_if: { contains: "Sprite" } },
  { id: 10, group: "Brand",    query: "mua sting nước tăng lực",          pass_if: { contains: "Sting" } },

  // === SYNONYM / SLANG ===
  { id: 11, group: "Synonym",  query: "cho mua 3 lon bò húc",             pass_if: { contains: "Red Bull", type: "exact_match" } },
  { id: 12, group: "Synonym",  query: "cho mua nước ngọt",                pass_if: { contains_any: ["Coca Cola", "Pepsi", "Sprite"] } },
  { id: 13, group: "Synonym",  query: "nước tăng lực",                    pass_if: { contains_any: ["Red Bull", "Sting"] } },
  { id: 14, group: "Synonym",  query: "mua bo huc",                       pass_if: { contains: "Red Bull" } },

  // === SIZE SPECIFIC ===
  { id: 15, group: "Size",     query: "mua coca chai 1 lít rưỡi",         pass_if: { contains: "Coca Cola" } },
  { id: 16, group: "Size",     query: "mua sữa vinamilk hộp 1 lít",       pass_if: { contains: "Vinamilk", type: "exact_match" } },
  { id: 17, group: "Size",     query: "mua lavie chai lớn",               pass_if: { contains: "Lavie" } },
  { id: 18, group: "Size",     query: "mua pepsi lon nhỏ",                pass_if: { contains: "Pepsi" } },
  { id: 19, group: "Size",     query: "cho chai nước suối 500ml",         pass_if: { contains_any: ["Lavie", "Aquafina"] } },

  // === QUANTITY + PACKAGING ===
  { id: 20, group: "Unit",     query: "lấy 2 lon bia tiger",              pass_if: { contains: "Tiger" } },
  { id: 21, group: "Unit",     query: "mua 1 thùng bia sài gòn",          pass_if: { contains: "Sài Gòn" } },
  { id: 22, group: "Unit",     query: "cho 1 lốc coca",                   pass_if: { contains: "Coca Cola" } },
  { id: 23, group: "Unit",     query: "mua 2 hộp sữa th true milk",       pass_if: { contains: "TH True Milk" } },

  // === MUST NOT / EXCLUSION ===
  { id: 24, group: "MustNot",  query: "mua coca không lấy loại zero",     pass_if: { contains: "Coca Cola", not_contains: "zero" } },
  { id: 25, group: "MustNot",  query: "mua bia không phải heineken",      pass_if: { contains_any: ["Tiger", "Sài Gòn"], not_contains: "Heineken" } },

  // === NON-DRINK CATEGORIES ===
  { id: 26, group: "NonDrink", query: "mua snack oishi",                  pass_if: { contains: "Oishi" } },
  { id: 27, group: "NonDrink", query: "cho mua mì hảo hảo",              pass_if: { contains: "Hảo Hảo" } },
  { id: 28, group: "NonDrink", query: "mua gạo st25",                    pass_if: { contains: "ST25" } },
  { id: 29, group: "NonDrink", query: "mua nước mắm nam ngư",            pass_if: { contains: "Nam Ngư" } },

  // === EDGE / TYPO ===
  { id: 30, group: "Edge",     query: "mua cocacola",                     pass_if: { contains: "Coca Cola" } },
];

// ─────────────────────────────────────────────
const results = {};
let currentFilter = 'all';

function renderRows() {
  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';
  TESTCASES.forEach(tc => {
    if (!matchFilter(tc.id)) return;
    const r = results[tc.id] || {};
    const row = document.createElement('tr');
    row.id = `row-${tc.id}`;
    row.innerHTML = buildRow(tc, r);
    tbody.appendChild(row);
  });
}

function matchFilter(id) {
  const r = results[id];
  if (currentFilter === 'all') return true;
  if (currentFilter === 'pending') return !r || r.status === 'pending' || r.status === 'running';
  if (currentFilter === 'pass') return r && r.verdict === true;
  if (currentFilter === 'fail') return r && r.verdict === false;
  return true;
}

function setFilter(f, el) {
  currentFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  renderRows();
}

function buildRow(tc, r) {
  const statusBadge = r.status === 'running'
    ? `<span class="badge running">…</span>`
    : r.status === 'done'
      ? (r.verdict ? `<span class="badge pass">✓ PASS</span>` : `<span class="badge fail">✗ FAIL</span>`)
      : `<span class="badge pending">—</span>`;

  let typeBadge = '—';
  if (r.type) {
    const cls = r.type === 'exact_match' ? 'exact' : r.type === 'needs_clarification' ? 'clarif' : 'no-result';
    const label = r.type === 'exact_match' ? 'Exact' : r.type === 'needs_clarification' ? 'Clarify' : 'No result';
    typeBadge = `<span class="badge ${cls}">${label}</span>`;
  }

  const conf = r.confidence !== undefined ? `<span class="conf">${(r.confidence * 100).toFixed(0)}%</span>` : '—';

  let itemsHtml = '—';
  if (r.items && r.items.length) {
    itemsHtml = r.items.map(it => {
      const nameLC = (it.name || '').toLowerCase();
      const matched = checkContains(tc.pass_if, it.name);
      return `<span class="item-tag ${matched ? 'matched' : ''}">${it.name}</span>`;
    }).join('');
  }
  if (r.error) itemsHtml = `<span class="error-cell">${r.error}</span>`;

  const latMs = r.latency !== undefined ? r.latency : null;
  const latStr = latMs !== null ? `<span class="latency ${latMs > 2000 ? 'slow' : ''}">${latMs}ms</span>` : '—';

  const passHint = buildPassHint(tc.pass_if);

  return `
    <td>${tc.id}</td>
    <td class="query-cell">
      <div class="query-text">${esc(tc.query)}</div>
      <div class="expect">${passHint} · ${tc.group}</div>
    </td>
    <td>${statusBadge}</td>
    <td>${typeBadge}</td>
    <td>${conf}</td>
    <td class="items-cell">${itemsHtml}</td>
    <td>${latStr}</td>
  `;
}

function buildPassHint(pass_if) {
  const parts = [];
  if (pass_if.contains) parts.push(`contains "${pass_if.contains}"`);
  if (pass_if.contains_any) parts.push(`contains any of [${pass_if.contains_any.join(', ')}]`);
  if (pass_if.not_contains) parts.push(`not "${pass_if.not_contains}"`);
  if (pass_if.type) parts.push(`type=${pass_if.type}`);
  return parts.join(' · ');
}

function checkContains(pass_if, name) {
  if (!name) return false;
  const n = name.toLowerCase();
  if (pass_if.contains && n.includes(pass_if.contains.toLowerCase())) return true;
  if (pass_if.contains_any && pass_if.contains_any.some(s => n.includes(s.toLowerCase()))) return true;
  return false;
}

function evaluate(tc, resp, items) {
  const { pass_if } = tc;
  const names = items.map(it => (it.name || '').toLowerCase());
  const allText = names.join(' ');

  // contains check
  if (pass_if.contains && !names.some(n => n.includes(pass_if.contains.toLowerCase()))) return false;
  if (pass_if.contains_any && !names.some(n => pass_if.contains_any.some(s => n.includes(s.toLowerCase())))) return false;

  // not_contains: none of the items should contain this
  if (pass_if.not_contains && names.some(n => n.includes(pass_if.not_contains.toLowerCase()))) return false;

  // type check
  if (pass_if.type && resp.type !== pass_if.type) return false;

  return true;
}

async function callApi(query) {
  const url = document.getElementById('apiUrl').value.trim();
  const t0 = performance.now();
  const res = await fetch(url, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ query, user_id: 'benchmark' }),
  });
  const latency = Math.round(performance.now() - t0);
  if (!res.ok) throw Object.assign(new Error(`HTTP ${res.status}`), { latency });
  const data = await res.json();
  data._latency = latency;
  return data;
}

function updateSummary() {
  const done = Object.values(results).filter(r => r.status === 'done');
  const passed = done.filter(r => r.verdict).length;
  const failed = done.filter(r => !r.verdict).length;
  const total = TESTCASES.length;
  const rate = done.length ? Math.round(passed / done.length * 100) : 0;
  const avgLat = done.length ? Math.round(done.reduce((s, r) => s + (r.latency || 0), 0) / done.length) : 0;

  document.getElementById('sPass').textContent = passed;
  document.getElementById('sFail').textContent = failed;
  document.getElementById('sTotal').textContent = `${done.length}/${total}`;
  document.getElementById('sRate').textContent = done.length ? `${rate}%` : '—';
  document.getElementById('sLatency').textContent = done.length ? `${avgLat}ms` : '—';
  document.getElementById('progressFill').style.width = `${Math.round(done.length / total * 100)}%`;
  document.getElementById('summary').style.display = 'flex';
}

function updateRow(tc) {
  const r = results[tc.id];
  const existing = document.getElementById(`row-${tc.id}`);
  if (!existing) return; // filtered out
  existing.innerHTML = buildRow(tc, r);
}

async function runAll() {
  document.getElementById('btnRun').disabled = true;
  document.getElementById('summary').style.display = 'flex';

  // init all as running
  TESTCASES.forEach(tc => { results[tc.id] = { status: 'running' }; });
  renderRows();

  // run sequentially to avoid hammering the server
  for (const tc of TESTCASES) {
    try {
      const resp = await callApi(tc.query);
      const items = resp.items || [];
      const verdict = evaluate(tc, resp, items);
      results[tc.id] = {
        status: 'done',
        verdict,
        type: resp.type,
        confidence: resp.confidence,
        items,
        latency: resp._latency,
      };
    } catch (e) {
      results[tc.id] = {
        status: 'done',
        verdict: false,
        error: e.message,
        latency: e.latency,
      };
    }
    updateRow(tc);
    updateSummary();
  }

  document.getElementById('btnRun').disabled = false;
}

function clearResults() {
  TESTCASES.forEach(tc => { delete results[tc.id]; });
  document.getElementById('summary').style.display = 'none';
  renderRows();
}

function esc(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// init
renderRows();
</script>
</body>
</html>
